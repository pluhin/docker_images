name: Build

# Единственный сборочный workflow на весь репозиторий.
#
# ЧТО БЫЛО ДО. Сборок было четыре: эта, build_manually (ручной дубль с
# устаревшими версиями действий и захардкоженным владельцем), плюс две
# отдельные — только под jenkins: одна собирала и сканировала на push, вторая
# собирала по тегу. Обе дублировали то, что здесь уже есть, и обе были
# сломаны: docker/login-action@v4 не существует, а разбор тега
# ${GITHUB_REF#refs/tags/jenkins=} ждал схему `jenkins=v1.2.3`, тогда как
# README обещал `jenkins:v1.2.3` — двоеточие в имени git-тега вообще
# запрещено. То есть сборка по тегу не работала ни в одном варианте.
#
# ТРИ ПОВОДА ЗАПУСКА, ОДИН КОНВЕЙЕР:
#   • push в master  → собираются только изменившиеся каталоги, теги
#                      latest и sha-<7>;
#   • git-тег вида <образ>/v1.2.3 → релиз одного образа, теги 1.2.3, 1.2, 1
#                      и latest;
#   • вручную        → любой каталог или все сразу.
#
# ПОЧЕМУ НЕТ paths-ignore. Фильтр путей применяется и к push тега, сравнивая
# файлы в его коммитах; тег обычно вешают на уже отправленный коммит, разница
# получается пустая и релизная сборка молча не запускается. Что собирать,
# решает job discover — там это видно и поддаётся отладке.

on:
  push:
    branches: [master, main]
    tags: ["*/v*"]
  workflow_dispatch:
    inputs:
      folder:
        description: "Каталог для сборки (пусто = все с Dockerfile)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  packages: write
  security-events: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Что собирать
    runs-on: ubuntu-latest
    outputs:
      folders: ${{ steps.pick.outputs.folders }}
      has-work: ${{ steps.pick.outputs.has-work }}
      version: ${{ steps.pick.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Диффу ниже нужна история; клон по умолчанию обрезан до одного
          # коммита, и git rev-parse HEAD~1 в нём не работает.
          fetch-depth: 0

      - name: Выбрать каталоги
        id: pick
        env:
          MANUAL_FOLDER: ${{ inputs.folder }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          dockerised() {
            for d in */; do
              [ -f "${d}Dockerfile" ] && printf '%s\n' "${d%/}"
            done
          }

          VERSION=""

          if [ "${{ github.ref_type }}" = "tag" ]; then
            # <образ>/v1.2.3 — косая черта разделяет однозначно даже когда в
            # имени образа есть дефисы (busy-box, cyta-balance-scraper).
            TAG="${{ github.ref_name }}"
            CANDIDATES="${TAG%/*}"
            VERSION="${TAG##*/v}"
            if [ ! -f "$CANDIDATES/Dockerfile" ]; then
              echo "::error::тег '$TAG' указывает на каталог '$CANDIDATES', в котором нет Dockerfile"
              exit 1
            fi
            case "$VERSION" in
              [0-9]*.[0-9]*.[0-9]*) : ;;
              *) echo "::error::'$VERSION' не похоже на semver; тег должен быть вида <образ>/v1.2.3"; exit 1 ;;
            esac
            echo "релиз $CANDIDATES версии $VERSION"

          elif [ -n "$MANUAL_FOLDER" ]; then
            if [ ! -f "$MANUAL_FOLDER/Dockerfile" ]; then
              echo "::error::в '$MANUAL_FOLDER' нет Dockerfile"
              exit 1
            fi
            CANDIDATES="$MANUAL_FOLDER"
            echo "ручной запуск, один каталог: $MANUAL_FOLDER"

          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CANDIDATES="$(dockerised)"
            echo "ручной запуск без каталога — собираем всё"

          else
            # event.before равен нулям на первом пуше ветки и может указывать
            # на коммит, снесённый force-push'ем. В обоих случаях откатываемся,
            # а не падаем.
            BEFORE="$EVENT_BEFORE"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              BEFORE="$(git rev-parse HEAD~1 2>/dev/null || true)"
            fi
            if [ -z "$BEFORE" ]; then
              echo "нет пригодного базового коммита — собираем всё"
              CANDIDATES="$(dockerised)"
            else
              echo "сравниваем $BEFORE..${{ github.sha }}"
              CHANGED="$(git diff --name-only "$BEFORE" "${{ github.sha }}")"
              # Изменился сам рецепт — пересобираем всё. Провенанс образа
              # включает то, как его собрали: порядок шагов, проверку Trivy,
              # набор тегов и метки. Оставить в реестре образы, собранные
              # прежним конвейером, значит держать latest, про который уже
              # нельзя сказать, чем он проверен.
              #
              # Этот случай уже стоил одного пропуска: коммит с правками
              # семи Dockerfile'ов упал на «Set up job», а следующий, что
              # починил workflow, ничего не пересобрал — в его диффе не было
              # ни одного каталога с Dockerfile.
              if printf '%s\n' "$CHANGED" | grep -qx '.github/workflows/build.yaml'; then
                echo "изменился build.yaml — собираем всё"
                CANDIDATES="$(dockerised)"
              else
                CANDIDATES="$(printf '%s\n' "$CHANGED" \
                              | awk -F/ 'NF>1 {print $1}' | sort -u)"
              fi
            fi
          fi

          LIST="$(mktemp)"
          for folder in $CANDIDATES; do
            [ -f "$folder/Dockerfile" ] && printf '%s\n' "$folder" >> "$LIST"
          done

          # jq собирает JSON матрицы. Склейка запятыми вручную давала невалидный
          # JSON на пустом списке; через файл с отбрасыванием пустых строк
          # случай «нечего собирать» остаётся честным [].
          JSON="$(jq -R -s -c 'split("\n") | map(select(length > 0)) | unique' < "$LIST")"
          COUNT="$(printf '%s' "$JSON" | jq 'length')"

          {
            echo "folders=$JSON"
            echo "version=$VERSION"
            [ "$COUNT" -gt 0 ] && echo "has-work=true" || echo "has-work=false"
          } >> "$GITHUB_OUTPUT"
          echo "будет собрано: $JSON"

  build:
    name: ${{ matrix.folder }}
    needs: discover
    if: needs.discover.outputs.has-work == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        folder: ${{ fromJson(needs.discover.outputs.folders) }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Вычислить имя и теги
        id: meta
        env:
          VERSION: ${{ needs.discover.outputs.version }}
        run: |
          set -euo pipefail
          # ghcr.io не принимает заглавные в пути репозитория, а
          # repository_owner несёт тот регистр, в котором заведён аккаунт.
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/$owner/${{ matrix.folder }}"

          if [ -n "$VERSION" ]; then
            # Релиз по тегу: полная версия плюс скользящие мажор и минор,
            # чтобы потребитель мог выбрать, насколько крепко пиниться.
            major="${VERSION%%.*}"
            rest="${VERSION#*.}"
            minor="${rest%%.*}"
            TAGS="$image:$VERSION"$'\n'"$image:$major.$minor"$'\n'"$image:$major"$'\n'"$image:latest"
          else
            # Обычный пуш: sha — неизменяемая запись, latest — то, что тянут
            # развёртывания с imagePullPolicy: Always.
            TAGS="$image:sha-${GITHUB_SHA::7}"$'\n'"$image:latest"
          fi

          # Блокирует ли Trivy публикацию — решает файл .trivy-blocking в
          # каталоге образа. Подробности в комментарии к самому шагу.
          if [ -f "${{ matrix.folder }}/.trivy-blocking" ]; then gate=1; else gate=0; fi

          {
            echo "image=$image"
            echo "scan-ref=$image:ci-scan"
            echo "gate=$gate"
            echo "tags<<__EOT__"
            echo "$TAGS"
            echo "__EOT__"
          } >> "$GITHUB_OUTPUT"
          echo "теги:"; echo "$TAGS"

      # Сборка идёт дважды намеренно. Первый проход только грузит образ в
      # локальный демон, чтобы Trivy было что сканировать: пушить непроверенное
      # нельзя, а сканировать по ссылке в реестре — значит уже опубликовать.
      # Второй проход берёт всё из кеша и стоит секунды.
      - name: Собрать для проверки
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.folder }}
          load: true
          push: false
          tags: ${{ steps.meta.outputs.scan-ref }}
          cache-from: type=gha,scope=${{ matrix.folder }}
          cache-to: type=gha,mode=max,scope=${{ matrix.folder }}

      # Отчёт для вкладки Security — заливается всегда, в том числе когда
      # проверка ниже валит сборку, поэтому отдельным шагом и с if: always().
      - name: Trivy — отчёт в Code scanning
        # Тег с префиксом v — обязательно. Прежние workflow ссылались на
        # aquasecurity/trivy-action@0.28.0, и когда-то это работало: тогда
        # публиковались оба варианта. Голые теги без v из репозитория убрали,
        # и ссылка перестала резолвиться — сборка падает на «Set up job», не
        # доходя ни до одного шага.
        uses: aquasecurity/trivy-action@v0.36.0
        if: always()
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2
        with:
          image-ref: ${{ steps.meta.outputs.scan-ref }}
          format: sarif
          output: trivy-${{ matrix.folder }}.sarif
          ignore-unfixed: true
          vuln-type: os,library
          severity: MEDIUM,HIGH,CRITICAL
          # Без этого SARIF игнорирует severity и выкладывает все уровни,
          # включая LOW, — вкладка Security перестаёт совпадать с тем, что
          # объявлено здесь.
          limit-severities-for-sarif: true

      - name: Загрузить SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.folder)) != ''
        with:
          sarif_file: trivy-${{ matrix.folder }}.sarif
          category: trivy-${{ matrix.folder }}

      # КОГДА НАХОДКА ЗАПРЕЩАЕТ ПУБЛИКАЦИЮ, А КОГДА ТОЛЬКО СООБЩАЕТ.
      #
      # Порог — CRITICAL с существующим исправлением. MEDIUM и HIGH всегда
      # только сообщаются: половина образов стоит на чужих базах —
      # jenkins/jenkins и linuxserver/plex — где HIGH есть почти всегда
      # независимо от нашего кода, и сборка, падающая каждый раз, не
      # защищает, а приучает отключать проверку.
      #
      # Но и CRITICAL блокирует не везде, и это не поблажка. Запрет на
      # публикацию пересобранного образа не убирает уязвимость: в реестре
      # остаётся прежний образ, который старше и содержит то же самое плюс
      # всё, что нашли за время с его выпуска. Для обёртки над чужой базой
      # запрет означает лишь «latest перестал обновляться», то есть делает
      # хуже. Смысл гейт имеет там, где зависимости наши и находку можно
      # закрыть в этом же репозитории — тогда красная сборка заставляет
      # поднять версию в requirements.txt, а не отложить.
      #
      # Поэтому блокировка включается файлом .trivy-blocking в каталоге
      # образа. Сейчас он есть у cyta-balance-scraper — единственного
      # образа, чьи зависимости перечислены рядом, в requirements.txt.
      # Остальные сканируются так же подробно, но находки уходят во вкладку
      # Security и в еженедельную сводку, а не останавливают выпуск.
      - name: Trivy — критические
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2
        with:
          image-ref: ${{ steps.meta.outputs.scan-ref }}
          format: table
          exit-code: ${{ steps.meta.outputs.gate }}
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL
          trivyignores: .trivyignore

      - name: Войти в ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Сначала CR_PAT, GITHUB_TOKEN запасным. Одного GITHUB_TOKEN здесь
          # мало: пакеты вроде ghcr.io/pluhin/cyta-balance-scraper заведены вне
          # этого репозитория, а такой пакет доступен GITHUB_TOKEN на запись
          # только после того, как сам пакет выдаст репозиторию доступ. Без
          # этого пуш падает с "denied: permission_denied: write_package" уже
          # после успешной сборки. Выдать пакету Actions-доступ в его
          # настройках — способ отказаться от PAT.
          password: ${{ secrets.CR_PAT || secrets.GITHUB_TOKEN }}

      - name: Опубликовать
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.folder }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=${{ matrix.folder }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=${{ matrix.folder }}

      - name: Сообщить в Slack
        if: always()
        # Обычный POST на вебхук: rtCamp/action-slack-notify читает адрес из
        # переменной окружения SLACK_WEBHOOK и игнорирует вход webhook-url,
        # из-за чего прежний шаг отправлял сообщения в никуда.
        #
        # Проверка «задан ли секрет» живёт в скрипте, а не в if: намеренно —
        # контекст secrets в условии шага недоступен, а полагаться на то,
        # виден ли собственный env: шага его же условию, не стоит.
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ needs.discover.outputs.version }}
          STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK:-}" ]; then
            echo "SLACK_WEBHOOK не задан — пропускаем уведомление"
            exit 0
          fi
          if [ "$STATUS" = "success" ]; then
            what="${VERSION:-latest}"
            text="🐳 Собран \`$IMAGE:$what\`"
          else
            text="❌ Сборка \`$IMAGE\` не прошла ($STATUS) — $RUN_URL"
          fi
          jq -n --arg text "$text" '{text: $text}' \
            | curl -sS -X POST -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK" >/dev/null
